<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>IFrame API Test</title>
<style>
  body { margin: 16px; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  #player { width: 100%; max-width: 640px; aspect-ratio: 16 / 9; }
  .row { margin: 10px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { padding: 8px 14px; font-size: 15px; }
  input { padding: 6px; width: 280px; }
  #status { font-size: 15px; }
  #log { white-space: pre-wrap; background: #000; padding: 8px; height: 180px; overflow-y: auto; font: 13px monospace; max-width: 640px; }
</style>
</head>
<body>
<h3>YouTube IFrame Player API 제어 테스트</h3>
<div class="row">
  <input id="video" value="M7lc1UVf-VE" placeholder="유튜브 URL 또는 영상 ID">
  <button onclick="load()">불러오기</button>
</div>
<div id="player"></div>
<div class="row">
  <button onclick="call('playVideo')">▶ 재생</button>
  <button onclick="call('pauseVideo')">⏸ 정지</button>
  <button onclick="toggle()">⏯ 토글</button>
  <button onclick="step(-10)">🔉 −10</button>
  <button onclick="step(+10)">🔊 +10</button>
</div>
<div class="row" id="status">상태: API 로딩 중…</div>
<div id="log"></div>

<script>
const STATE = { "-1": "시작 전", 0: "종료", 1: "재생 중", 2: "일시정지", 3: "버퍼링", 5: "대기(cued)" };
let player = null;

function log(msg) {
  const el = document.getElementById("log");
  el.textContent += new Date().toLocaleTimeString() + "  " + msg + "\n";
  el.scrollTop = el.scrollHeight;
}

function showStatus() {
  if (!player || !player.getPlayerState) return;
  document.getElementById("status").textContent =
    `상태: ${STATE[player.getPlayerState()] ?? player.getPlayerState()}  |  볼륨: ${player.getVolume()}  |  음소거: ${player.isMuted()}`;
}

function parseVideoId(text) {
  text = text.trim();
  const m = text.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : text;
}

// 1) 유튜브 API 스크립트 로드 (API 키 불필요)
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
tag.onerror = () => log("❌ iframe_api 스크립트를 불러오지 못했습니다 (네트워크 확인)");
document.head.appendChild(tag);

// 2) 스크립트가 로드되면 유튜브가 이 함수를 호출함
function onYouTubeIframeAPIReady() {
  log("API 로드됨 → 플레이어 생성");
  player = new YT.Player("player", {
    videoId: parseVideoId(document.getElementById("video").value),
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => { log("✅ onReady: 제어 가능"); showStatus(); },
      onStateChange: (e) => { log(`onStateChange: ${STATE[e.data] ?? e.data}`); showStatus(); },
      onError: (e) => log(`❌ onError ${e.data}  (2: 잘못된 ID, 5: HTML5 오류, 100: 영상 없음, 101/150: 퍼가기 금지)`),
    },
  });
}

// 3) 제어 함수들
function call(fn) {
  if (!player) return log("플레이어 준비 전");
  player[fn]();
  log(`${fn}()`);
}

function toggle() {
  if (!player) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) call("pauseVideo");
  else call("playVideo");
}

function step(d) {
  if (!player) return;
  if (player.isMuted()) player.unMute();
  const v = Math.min(100, Math.max(0, player.getVolume() + d));
  player.setVolume(v);
  log(`setVolume(${v})`);
  setTimeout(showStatus, 200);  // getVolume()은 setVolume 직후 바로 반영되지 않을 수 있음
}

function load() {
  if (!player) return;
  const id = parseVideoId(document.getElementById("video").value);
  player.loadVideoById(id);
  log(`loadVideoById("${id}")`);
}

setInterval(showStatus, 1000);
</script>
</body>
</html>
