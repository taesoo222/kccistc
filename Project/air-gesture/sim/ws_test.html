<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>WebSocket Player Test</title>
<style>
  body { margin: 16px; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  #player { width: 100%; max-width: 640px; aspect-ratio: 16 / 9; }
  .row { margin: 10px 0; font-size: 15px; }
  #conn { font-weight: bold; color: #f44336; }
  #conn.ok { color: #8bc34a; }
  #log { white-space: pre-wrap; background: #000; padding: 8px; height: 200px; overflow-y: auto; font: 13px monospace; max-width: 640px; }
</style>
</head>
<body>
<h3>WebSocket → YouTube 제어 테스트</h3>
<div class="row">서버 연결: <span id="conn">연결 안 됨</span></div>
<div id="player"></div>
<div class="row" id="status">상태: API 로딩 중…</div>
<div id="log"></div>

<script>
const STATE = { "-1": "시작 전", 0: "종료", 1: "재생 중", 2: "일시정지", 3: "버퍼링", 5: "대기(cued)" };
let player = null;
let ws = null;

function log(msg) {
  const el = document.getElementById("log");
  el.textContent += new Date().toLocaleTimeString() + "  " + msg + "\n";
  el.scrollTop = el.scrollHeight;
}

function showStatus() {
  if (!player || !player.getPlayerState) return;
  document.getElementById("status").textContent =
    `상태: ${STATE[player.getPlayerState()] ?? player.getPlayerState()}  |  볼륨: ${player.getVolume()}`;
}

// ---- 1. YouTube IFrame Player (iframe_test.html과 동일) ----
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    videoId: "M7lc1UVf-VE",
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => { log("✅ 플레이어 준비됨"); showStatus(); },
      onStateChange: (e) => { log(`onStateChange: ${STATE[e.data] ?? e.data}`); showStatus(); report(); },
      onError: (e) => log(`❌ onError ${e.data}`),
    },
  });
}

// ---- 2. WebSocket: 서버에 연결하고 명령을 기다림 ----
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  const conn = document.getElementById("conn");
  ws.onopen = () => { conn.textContent = "연결됨"; conn.className = "ok"; log("🔌 서버 연결됨"); report(); };
  ws.onclose = () => {
    conn.textContent = "끊김 — 1초 후 재연결"; conn.className = "";
    setTimeout(connect, 1000);
  };
  ws.onmessage = (e) => {
    log(`📩 받은 명령: ${e.data}`);
    run(JSON.parse(e.data));
  };
}
connect();

// ---- 3. 받은 명령을 IFrame API 호출로 실행 ----
function run(cmd) {
  if (!player) return log("플레이어 준비 전");
  switch (cmd.cmd) {
    case "play":   player.playVideo(); break;
    case "pause":  player.pauseVideo(); break;
    case "volume_step": setVolume(player.getVolume() + cmd.delta); break;
    case "volume":      setVolume(cmd.value); break;
    default: log(`알 수 없는 명령: ${cmd.cmd}`);
  }
}

function setVolume(v) {
  v = Math.min(100, Math.max(0, v));
  if (player.isMuted()) player.unMute();
  player.setVolume(v);
  log(`setVolume(${v})`);
  setTimeout(() => { showStatus(); report(v); }, 200);  // getVolume()은 바로 반영되지 않을 수 있음
}

// ---- 4. 실제 상태를 서버로 되돌려 보고 (양방향 확인용) ----
function report(volume) {
  if (!player || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "status", state: STATE[player.getPlayerState()], volume: volume ?? player.getVolume() }));
}
</script>
</body>
</html>
